<style>
html,body{margin:0;height:100%;background:#0f1a16;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.btn{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:#fff;font:bold 26px sans-serif;display:flex;align-items:center;justify-content:center;bottom:max(22px,env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(2px)}
.btn:active{background:rgba(255,255,255,.35)}
#bl{left:max(22px,env(safe-area-inset-left))} #br{left:calc(max(22px,env(safe-area-inset-left)) + 92px)}
#ba{right:calc(max(22px,env(safe-area-inset-right)) + 92px)} #bj{right:max(22px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 40px)}
#bd{right:calc(max(22px,env(safe-area-inset-right)) + 184px);display:none;width:60px;height:60px;font-size:20px}
#reset{position:fixed;top:8px;right:10px;font-size:11px;color:rgba(255,255,255,.35);background:none;border:none;z-index:5}
@media (hover:hover) and (pointer:fine){.btn{display:none!important}}
</style></head><body>

function rectSolid(x,y,w,h){const xs=[x],ys=[y];for(let px=x+16;px<x+w;px+=16)xs.push(px);xs.push(x+w);for(let py=y+16;py<y+h;py+=16)ys.push(py);ys.push(y+h);for(const px of xs)for(const py of ys)if(solid(tileAt(px,py)))return true;return false;}

function moveY(o,dy,dropThru){o.y+=dy;if(rectSolid(o.x,o.y,o.w,o.h)){if(dy>0)o.y=Math.floor((o.y+o.h)/TS)*TS-o.h-0.01;else o.y=Math.floor(o.y/TS)*TS+TS+0.01;return true;}

   if(e.g&&e.t<=0){e.t=1.6;e.vy=-560;e.vx=(Math.abs(pl.x-e.x)<320?Math.sign(pl.x-e.x):(Math.random()<0.5?-1:1))*140;e.g=false;}
   e.box={x:e.x+14,y:e.y+10,w:36,h:54};}

 const mx=-(cam.x*0.4)%480,my=-(cam.y*0.3);for(let x=mx-480;x<VW+480;x+=480)ctx.drawImage(m,x,my+160,480,270*2);ctx.globalAlpha=1;}
const HF={idle:[0,1],run:[2,3,4,5],jump:[6],fall:[7],atk:[8,9,10],hit:[11],dash:[6]};
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,VW,VH);
 if(zoneMix<1){drawBG(zonePrev,1);drawBG(camZone,zoneMix);}else drawBG(camZone,1);
 const sx=shake>0?(Math.random()-0.5)*8:0,sy=shake>0?(Math.random()-0.5)*8:0;
 ctx.setTransform(1,0,0,1,Math.round(-cam.x+sx),Math.round(-cam.y+sy));
 const c0=Math.max(0,Math.floor(cam.x/TS)),c1=Math.min(MW-1,Math.ceil((cam.x+VW)/TS)),r0=Math.max(0,Math.floor(cam.y/TS)),r1=Math.min(MH-1,Math.ceil((cam.y+VH)/TS));
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=grid[r][c];if(t)ctx.drawImage(IMG.tiles,t*16,0,16,16,c*TS,r*TS,TS,TS);}
 // entities
 for(const e of alive){if(e.x<cam.x-100||e.x>cam.x+VW+100||e.y<cam.y-100||e.y>cam.y+VH+100)continue;
  if(e.k==='a'){const f=Math.floor(time*4)%3;ctx.save();if(e.dir>0){ctx.translate(e.x+64,e.y);ctx.scale(-1,1);ctx.translate(-e.x,-e.y);}ctx.drawImage(IMG.ea,f*32,0,32,32,e.x,e.y,64,64);ctx.restore();}
  else if(e.k==='b'){const f=!e.g?2:(e.t<0.3?1:0);ctx.drawImage(IMG.eb,f*32,0,32,32,e.x,e.y,64,64);}
  else if(e.k==='c'){const f=Math.floor(time*5)%3;ctx.drawImage(IMG.ec,f*32,0,32,32,e.x,e.y,64,64);}
  else if(e.k==='cp'){const on=save.cp&&save.cp.id===e.id;ctx.drawImage(IMG.items,on?64:48,0,16,16,e.x,e.y-32,32,64);if(on){ctx.fillStyle='rgba(125,214,255,'+(0.25+Math.sin(time*4)*0.1)+')';ctx.beginPath();ctx.arc(e.x+16,e.y-6,10+Math.sin(time*4)*2,0,7);ctx.fill();}}
  else if(e.k==='D'){const f=Math.floor(time*3)%2;ctx.fillStyle='rgba(125,214,255,0.25)';ctx.beginPath();ctx.arc(e.x+16,e.y+16,24+Math.sin(time*3)*4,0,7);ctx.fill();ctx.drawImage(IMG.items,f*16,0,16,16,e.x,e.y+Math.sin(time*3)*4-8,32,32);}
  else if(e.k==='H'){ctx.drawImage(IMG.items,32,0,16,16,e.x,e.y+Math.sin(time*3)*3-6,32,32);}
  else if(e.k==='F'){const f=Math.floor(time*2)%3;ctx.drawImage(IMG.altar,f*32,0,32,32,e.x,e.y,64,64);}
  if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(e.box.x,e.box.y,e.box.w,e.box.h);ctx.globalCompositeOperation='source-over';}
 }
 // player
 if(!(pl.inv>0&&Math.floor(time*20)%2&&!pl.dead)){const fr=HF[pl.anim];let f;
  if(pl.anim==='atk'){const p=(0.32-pl.atk)/0.32;f=fr[p<0.2?0:p<0.7?1:2];}else if(pl.anim==='run')f=fr[Math.floor(time*10)%4];else if(pl.anim==='idle')f=fr[Math.floor(time*2)%2];else f=fr[0];
  const dx=pl.x+pl.w/2-36,dy=pl.y+pl.h-66;ctx.save();if(pl.face<0){ctx.translate(dx+72,dy);ctx.scale(-1,1);ctx.translate(-dx,-dy);}
  if(pl.dash>0){ctx.globalAlpha=0.35;ctx.drawImage(IMG.hero,f*72,0,72,72,dx-pl.face*14*(pl.face<0?-1:1),dy,72,72);ctx.globalAlpha=1;}
  if(pl.dead>0){ctx.globalAlpha=Math.max(0,pl.dead/1.6);}
  ctx.drawImage(IMG.hero,f*72,0,72,72,dx,dy,72,72);ctx.restore();ctx.globalAlpha=1;}
 for(const p of particles){ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.t*3);ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);}ctx.globalAlpha=1;
 // HUD
 ctx.setTransform(1,0,0,1,0,0);
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,VW,VH);}
 for(let i=0;i<save.maxhp;i++){ctx.globalAlpha=i<pl.hp?1:0.25;ctx.drawImage(IMG.items,32,0,16,16,16+i*30,14,26,26);}ctx.globalAlpha=1;
 if(save.dash){ctx.globalAlpha=pl.dashc>0?0.35:1;ctx.drawImage(IMG.items,0,0,16,16,16,46,26,26);ctx.globalAlpha=1;}
 ctx.font='bold 18px "Trebuchet MS",sans-serif';ctx.textAlign='center';
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT);ctx.fillStyle='rgba(20,16,30,0.6)';const w=ctx.measureText(msg).width+30;ctx.fillRect(VW/2-w/2,VH-64,w,34);ctx.fillStyle='#fff';ctx.fillText(msg,VW/2,VH-41);ctx.globalAlpha=1;}
 if(pl.state==='title'){ctx.fillStyle='rgba(12,20,28,0.55)';ctx.fillRect(0,0,VW,VH);ctx.fillStyle='#e8f4ff';ctx.font='bold 64px Georgia,serif';ctx.fillText('RUNENRITTER',VW/2,VH/2-40);
  ctx.font='20px "Trebuchet MS",sans-serif';ctx.fillStyle='#bfe6ff';ctx.fillText('Ein kleines Metroidvania',VW/2,VH/2);ctx.fillStyle='#fff';ctx.globalAlpha=0.6+Math.sin(time*4)*0.4;ctx.fillText(save.cp?'Sprung, Angriff oder Taste drücken zum Fortsetzen':'Sprung, Angriff oder Taste drücken zum Starten',VW/2,VH/2+60);ctx.globalAlpha=1;
  ctx.font='14px sans-serif';ctx.fillStyle='#9fc';ctx.fillText('Tastatur: Pfeile/WASD · Z/Leertaste Sprung · X/J Angriff · C/K Dash · ↓+Sprung durch Plattformen',VW/2,VH-30);
  ctx.drawImage(IMG.hero,0,0,72,72,VW/2-72,VH/2+90,144,144);}
 if(win){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.85,win*0.5)+')';ctx.fillRect(0,0,VW,VH);if(win>1){ctx.fillStyle='#223';ctx.font='bold 56px Georgia,serif';ctx.fillText('Der Runenaltar erwacht.',VW/2,VH/2-20);ctx.font='22px "Trebuchet MS",sans-serif';ctx.fillText('Du hast den Wald befriedet. Danke fürs Spielen, Ritter.',VW/2,VH/2+30);
  ctx.font='16px sans-serif';ctx.fillStyle='#556';ctx.fillText(save.heart?'Alles gefunden: Herzstein & Runensprint.':'Tipp: Irgendwo im Nordwesten wartet noch ein Herzstein.',VW/2,VH/2+70);ctx.fillText('Doppelt tippen zum Neustart',VW/2,VH/2+100);}}
}
let last=0;function loop(t){const dt=Math.min(0.033,(t-last)/1000||0);last=t;if(toLoad===0){update(dt);render();}requestAnimationFrame(loop);}requestAnimationFrame(loop);
// reset
let lastTap=0;cv.addEventListener('touchend',e=>{if(win>1){const n=Date.now();if(n-lastTap<400){localStorage.removeItem(KEY);location.reload();}lastTap=n;}});
addEventListener('keydown',e=>{if(win>1&&e.code==='KeyR'){localStorage.removeItem(KEY);location.reload();}});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Spielstand wirklich löschen?')){localStorage.removeItem(KEY);location.reload();}});
// scale
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=VW*s+'px';cv.style.height=VH*s+'px';}addEventListener('resize',fit);fit();
})();
</script>
